[package]
name = "fleet-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fleet-protocol = { version = "0.1.0", path = "../protocol" }
fleet-crypto = { version = "0.1.0", path = "../crypto" }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.39.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
fleet-model = { version = "0.1.0", path = "../model" }
fleet-config = { version = "0.1.0", path = "../config" }
url = { version = "2.5.8", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-retry = "0.3.2"
failsafe = "1.3.0"
serde_with = "3.24.0"

[dev-dependencies]
toml = "1.1.8"
