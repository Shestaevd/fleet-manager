[workspace]
resolver = "3"
members = ["crates/agent", "crates/receiver", "crates/client", "crates/protocol", "crates/crypto", "crates/model", "crates/config", "crates/util"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
fleet-config = { path = "crates/config" }
fleet-crypto = { path = "crates/crypto" }
fleet-model = { path = "crates/model" }
fleet-protocol = { path = "crates/protocol" }
fleet-util = { path = "crates/util" }
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
postcard = { version = "1.1.3", features = ["use-std"] }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
